                        <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharatiya Cockroachwadi Party (BCP)</title>
    <style>
        :root {
            --bg-color: #0b0f19; 
            --card-bg: #151c2c; 
            --text-color: #f3f4f6;
            --accent-color: #fbc02d; 
            --border-color: #1e293b;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #0b0f19;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav .logo {
            color: var(--accent-color);
            font-weight: 900;
            font-size: 1.5rem;
            text-decoration: none;
        }

        nav .nav-links {
            display: flex;
            gap: 15px;
        }

        nav .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 1.2rem;
            font-style: italic;
            color: #94a3b8;
            margin: 0;
        }

        .intro-box {
            background-color: var(--card-bg);
            border-left: 4px solid var(--accent-color);
            padding: 15px 20px;
            margin-bottom: 40px;
            font-size: 1.1rem;
            border-radius: 0 8px 8px 0;
        }

        h2 {
            font-size: 1.6rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 40px;
            color: var(--accent-color);
        }

        /* Clean No-Photo Single Leadership Card */
        .team-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .team-card {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color); /* Premium border for Supreme leader */
            border-radius: 16px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .team-card h3 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            color: white;
            letter-spacing: 0.5px;
        }

        .team-card p {
            color: #94a3b8;
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .insta-link {
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            background-color: rgba(251, 192, 45, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .insta-link:hover {
            background-color: var(--accent-color);
            color: #0b0f19;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
        }

        .info-card strong {
            display: block;
            margin-bottom: 5px;
            color: var(--accent-color);
        }

        ol {
            padding-left: 20px;
        }

        li {
            margin-bottom: 15px;
            padding-left: 5px;
        }

        li strong {
            display: block;
            font-size: 1.1rem;
            color: white;
        }

        .form-section {
            background-color: var(--card-bg);
            border: 2px dashed var(--border-color);
            padding: 25px;
            margin-top: 40px;
            border-radius: 12px;
        }

        .checkbox-group {
            margin: 15px 0;
        }

        .checkbox-group label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            margin-right: 10px;
            accent-color: var(--accent-color);
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: #0b0f19;
            text-align: center;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        @media (max-width: 480px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
